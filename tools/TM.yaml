identity:
  name: "tm"
  author: "liux297"
  label:
    zh_Hans: "技能管理"
    en_US: "skill manager"
    ja_JP: "skill manager"
    pt_BR: "skill manager"
description:
  human:
    zh_Hans: "管理本地 skills 技能包：新增、删除、查看、下载。"
    en_US: "Manage local skill packages: add, delete, list, download."
    ja_JP: "ローカルのスキルパッケージを管理（追加/削除/表示/ダウンロード）。"
    pt_BR: "Gerenciar pacotes de habilidades locais: adicionar, remover, listar, baixar."
  llm: "Manage local skill packages: add, delete, list, download."
parameters:
  - name: command
    type: string
    required: true
    label:
      en_US: Command
      zh_Hans: 命令
      pt_BR: Command
      ja_JP: コマンド
    human_description:
      en_US: "supported commands: add, delete, list, download"
      zh_Hans: "支持：查看技能、新增技能、删除技能 <名称>、下载技能 <名称>"
      pt_BR: "Gerenciar pacotes de habilidades locais (adicionar/remover/visualizar/baixar)."
      ja_JP: "ローカルのスキルパッケージを管理（追加/削除/表示/ダウンロード）"
    llm_description: "supported commands: add, delete, list, download"
    form: llm
  - name: skill_space
    type: string
    required: true
    default: "default"
    label:
      en_US: Skill Space
      zh_Hans: Skill 空间
      pt_BR: Espaço de Skills
      ja_JP: Skill スペース
    human_description:
      en_US: "Skill library managed by this workflow. Use the same value in Skill Agent."
      zh_Hans: "本节点管理的独立技能库名称，需要与 Skill Agent 节点配置保持一致。"
      pt_BR: "Biblioteca de skills gerenciada por este workflow."
      ja_JP: "このワークフローが管理する Skill ライブラリ。"
    llm_description: "Workflow-level isolated skill library name."
    form: form
  - name: files
    type: files
    required: false
    label:
      en_US: Zip files
      zh_Hans: Zip压缩包
      pt_BR: Zip files
      ja_JP: Zipファイル
    human_description:
      en_US: "Zip package(s) for add command."
      zh_Hans: "新增技能时上传 zip 压缩包"
      pt_BR: "Zip package(s) for add command."
      ja_JP: "新增技能 用の zip"
    llm_description: "Zip package(s) for add command"
    form: form
  - name: archive_url
    type: string
    required: false
    label:
      en_US: ZIP download URL
      zh_Hans: ZIP 下载地址
      pt_BR: URL de download do ZIP
      ja_JP: ZIP ダウンロード URL
    human_description:
      en_US: "Optional public http(s) ZIP URL, such as a GitHub Release asset or repository archive. Used when no file is uploaded."
      zh_Hans: "可选的公开 http(s) ZIP 直链，例如 GitHub Release 资产或仓库 archive 地址；未上传文件时使用。"
      pt_BR: "URL http(s) público opcional para o ZIP, usado quando nenhum arquivo é enviado."
      ja_JP: "ファイル未アップロード時に使用する公開 http(s) ZIP URL。"
    llm_description: "Optional public http(s) ZIP URL for the add command; uploaded files take precedence."
    form: form
extra:
  python:
    source: tools/TM.py
