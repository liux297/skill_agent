identity:
  name: "skill_agent"
  author: "liux297"
  label:
    zh_Hans: "Skill_Agent"
    en_US: "Skill_Agent"
    ja_JP: "Skill_Agent"
    pt_BR: "Skill_Agent"
description:
  human:
    zh_Hans: "基于 Skill 渐进式披露模式构建的通用型 Agent 插件，参考/借鉴 OpenClaw 与 Hermes 的 Agent 架构，支持自定义变量注入、文件交付与跨轮次交互。"
    en_US: "General-purpose Agent plugin built on the Skill Progressive Disclosure pattern, with references to OpenClaw and Hermes agent architectures, supporting custom_variables injection, file delivery and cross-turn interaction."
    ja_JP: "Skill 漸進的開示パターンに基づく汎用的な Agent プラグイン。OpenClaw および Hermes の Agent アーキテクチャを参考にしています。"
    pt_BR: "Plugin de Agent de uso geral baseado no padrão de Divulgação Progressiva de Skills, com referência às arquiteturas de agent OpenClaw e Hermes."
  llm: "Skill_Agent is a general-purpose Agent plugin built on the Skill Progressive Disclosure pattern, with references to OpenClaw and Hermes agent architectures, supporting custom_variables injection, file delivery and cross-turn interaction."
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Query string
      zh_Hans: 查询语句
      pt_BR: Query string
      ja_JP: クエリ文字列
    human_description:
      en_US: "please input your question"
      zh_Hans: "请输入你想问的问题"
      pt_BR: "please input your question"
      ja_JP: "クエリ文字列は、Skill_Agent に対して実行するタスクを指定する必要があります。"
    llm_description: "please input your question"
    form: llm

  - name: files
    type: files
    required: false
    label:
      en_US: Files
      zh_Hans: 上传文件
      pt_BR: Files
      ja_JP: ファイル
    human_description:
      en_US: "Upload file(s) for the agent to process."
      zh_Hans: "上传文件，供 Agent 按技能说明书处理"
      pt_BR: "Upload file(s) for the agent to process."
      ja_JP: "エージェントが処理するファイルをアップロードします"
    llm_description: "Upload file(s) for the agent to process."
    form: llm

  - name: skill_space
    type: string
    required: true
    default: "default"
    label:
      en_US: Skill Space
      zh_Hans: Skill 空间
      pt_BR: Espaço de Skills
      ja_JP: Skill スペース
    human_description:
      en_US: "Isolated skill library selected by this workflow. Workflows using different names do not share skill changes."
      zh_Hans: "当前工作流使用的独立技能库名称；不同名称的工作流互不影响。默认 default 兼容原有技能目录。"
      pt_BR: "Biblioteca de skills isolada usada por este workflow."
      ja_JP: "このワークフローが使用する分離された Skill ライブラリ。"
    llm_description: "Workflow-level isolated skill library name."
    form: form

  - name: enabled_skills
    type: string
    required: false
    label:
      en_US: Enabled Skills
      zh_Hans: 启用的 Skills
      pt_BR: Skills habilitadas
      ja_JP: 有効な Skills
    human_description:
      en_US: "Optional comma-separated skill folder names. Leave empty to expose every skill in the selected space."
      zh_Hans: "可选，填写逗号分隔的技能目录名称；留空表示使用当前空间的全部技能。"
      pt_BR: "Nomes de skills separados por vírgula; vazio habilita todas."
      ja_JP: "カンマ区切りの Skill フォルダー名。空欄ではすべて有効。"
    llm_description: "Optional allow-list of skill folder names."
    form: form

  - name: skill_version
    type: string
    required: false
    label:
      en_US: Required Skill Version
      zh_Hans: 固定 Skill 版本
      pt_BR: Versão obrigatória da Skill
      ja_JP: 必須 Skill バージョン
    human_description:
      en_US: "Optional expected version. Requires exactly one enabled skill and stops execution if its declared version differs."
      zh_Hans: "可选版本校验；填写后必须只启用一个 Skill，实际版本不一致时停止执行，避免线上流程静默漂移。"
      pt_BR: "Versão esperada opcional; interrompe em caso de incompatibilidade."
      ja_JP: "任意の期待バージョン。不一致の場合は実行を停止します。"
    llm_description: "Optional fail-closed version requirement for one enabled skill."
    form: form

  - name: include_shared_skills
    type: boolean
    required: true
    default: false
    label:
      en_US: Include Shared Skills
      zh_Hans: 加载公共 Skills
      pt_BR: Incluir Skills compartilhadas
      ja_JP: 共有 Skills を読み込む
    human_description:
      en_US: "Also load the shared skill space as read-only fallback; private skills with the same folder name take precedence."
      zh_Hans: "同时加载 shared 公共空间作为只读补充；同名时当前工作流空间优先。"
      pt_BR: "Também carrega o espaço compartilhado como somente leitura."
      ja_JP: "共有スペースを読み取り専用の補助として読み込みます。"
    llm_description: "Include read-only shared skills after private workflow skills."
    form: form

  - name: model
    type: model-selector
    scope: llm
    required: true
    label:
      en_US: Model
      zh_Hans: 大模型
      pt_BR: Model
      ja_JP: モデル
    human_description:
      en_US: Select an LLM to run this tool.
      zh_Hans: 选择用于运行本工具的大模型
      pt_BR: Select an LLM to run this tool.
      ja_JP: このツールを実行する LLM を選択します
    llm_description: Select an LLM to run this tool.
    form: form

  - name: max_steps
    type: number
    required: true
    default: 15
    label:
      en_US: Max steps
      zh_Hans: 执行轮数
      pt_BR: Max steps
      ja_JP: 最大ステップ
    human_description:
      en_US: Max reasoning/tool steps inside one call.
      zh_Hans: 单次调用内部最多执行多少轮“思考/调用技能”
      pt_BR: Max reasoning/tool steps inside one call.
      ja_JP: 1回の呼び出し内での最大ステップ数
    llm_description: Max reasoning/tool steps inside one call.
    form: form

  - name: memory_turns
    type: number
    required: true
    default: 12
    label:
      en_US: Memory turns
      zh_Hans: 单轮窗口
      pt_BR: Memory turns
      ja_JP: メモリターン
    human_description:
      en_US: How many recent turns to keep during the run.
      zh_Hans: 单次调用内部保留最近多少轮上下文
      pt_BR: How many recent turns to keep during the run.
      ja_JP: 実行中に保持する直近ターン数
    llm_description: How many recent turns to keep during the run.
    form: form

  - name: system_prompt
    type: string
    required: false
    label:
      en_US: System Prompt
      zh_Hans: 系统提示词
      pt_BR: System Prompt
      ja_JP: システムプロンプト
    human_description:
      en_US: "Custom system prompt to override the default agent behavior instructions."
      zh_Hans: "自定义系统提示词，用于覆盖或增强默认的 Agent 行为指令。留空则使用内置默认提示词。"
      pt_BR: "Prompt de sistema personalizado para substituir as instruções padrão do agente."
      ja_JP: "エージェントのデフォルト動作指示を上書きするカスタムシステムプロンプト。"
    llm_description: "Custom system prompt that overrides or extends the default agent behavior instructions. Leave empty to use built-in defaults."
    form: form

  - name: custom_variables
    type: string
    required: false
    label:
      en_US: Custom Variables
      zh_Hans: 自定义变量
      pt_BR: Variáveis personalizadas
      ja_JP: カスタム変数
    human_description:
      en_US: "JSON key-value pairs injected into the agent context, e.g. {\"current_user\":\"Alice\"}"
      zh_Hans: "JSON 键值对，注入到 Agent 上下文中供技能使用，例如 {\"current_user\":\"Alice\"}"
      pt_BR: "Pares chave-valor JSON injetados no contexto do agente"
      ja_JP: "エージェントコンテキストに注入されるJSONキー・バリュー・ペア"
    llm_description: "Optional JSON object of custom variables (e.g. current_user, team_id) that will be available to skills via get_session_context"
    form: llm

  - name: verbose
    type: boolean
    required: true
    default: false
    label:
      en_US: Debug Mode
      zh_Hans: 调试模式
      pt_BR: Modo verboso
      ja_JP: 詳細モード
    human_description:
      en_US: "Show executed commands, working directories, tool parameters and command stdout/stderr. Keep off for user-facing runs."
      zh_Hans: "显示实际执行命令、工作目录、工具参数和命令输出/错误，便于开发排错；面向最终用户时请关闭。"
      pt_BR: "Mostrar progresso detalhado da execução de ferramentas."
      ja_JP: "ツール実行の詳細な進捗を表示するかどうか。"
    llm_description: "Debug switch: show detailed commands, paths and output for troubleshooting."
    form: form

  - name: history_turns
    type: number
    required: true
    default: 3
    label:
      en_US: History turns
      zh_Hans: 记忆窗口
      pt_BR: History turns
      ja_JP: 履歴ターン
    human_description:
      en_US: How many previous runs to inject as raw transcript.
      zh_Hans: 跨回合注入最近多少轮原文对话（0 表示不注入）
      pt_BR: How many previous runs to inject as raw transcript.
      ja_JP: 以前の実行から挿入する原文のターン数
    llm_description: Inject previous turns as raw transcript for continuity.
    form: form

  - name: max_stdout_chars
    type: number
    required: true
    default: 30000
    label:
      en_US: Max stdout chars
      zh_Hans: 输出截断上限
      pt_BR: Max stdout chars
      ja_JP: 最大出力文字数
    human_description:
      en_US: "Max characters for command stdout. Exceeded output will be JSON-compressed or truncated. Lower this for small-context models (e.g. 6000 for 4K tokens)."
      zh_Hans: "命令输出的最大字符数，超出后自动 JSON 压缩或截断。小上下文模型建议调低（如 4K token 模型设为 6000）。"
      pt_BR: "Max characters for command stdout. Lower for small-context models."
      ja_JP: "コマンド出力の最大文字数。小さいコンテキストモデルでは下げてください。"
    llm_description: "Max characters for command stdout before compression/truncation."
    form: form

  - name: allowed_commands
    type: string
    required: false
    default: "python,python3,node,pandoc,soffice,pdftoppm"
    label:
      en_US: Allowed Commands
      zh_Hans: 允许的命令
      pt_BR: Comandos permitidos
      ja_JP: 許可コマンド
    human_description:
      en_US: "Comma-separated list of allowed commands. Edit this list to control which commands the agent can execute."
      zh_Hans: "允许执行的命令列表，用逗号分隔。直接编辑此字段即可增删允许的命令。"
      pt_BR: "Lista de comandos permitidos, separados por vírgula."
      ja_JP: "許可するコマンドリスト（カンマ区切り）。このフィールドを編集して許可コマンドを管理。"
    llm_description: "Comma-separated list of allowed commands that the agent can execute via run_skill_command/run_temp_command."
    form: form

  - name: allow_unsafe_commands
    type: boolean
    required: true
    default: false
    label:
      en_US: Unsafe command mode
      zh_Hans: 高风险命令模式
    human_description:
      en_US: "Allow shells, package managers and network clients. Enable only for trusted, self-hosted skills."
      zh_Hans: "允许 shell、包管理器和网络客户端；仅限完全可信的自托管技能使用。"
    form: form
extra:
  python:
    source: tools/skill_agent.py
